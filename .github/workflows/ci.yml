name: CI

on:
  pull_request:
    branches: [develop, prod]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew clean build
