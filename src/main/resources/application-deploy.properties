# ===============================
# DEPLOY PROFILE (Render)
# ===============================
# Render provides internal DB URL/credentials via environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Render injects PORT dynamically in many setups.
server.port=${PORT:${SERVER_PORT:10000}}

# Production-safe defaults
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
