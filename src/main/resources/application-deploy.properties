# ===============================
# DEPLOY PROFILE (Render)
# ===============================
# Prefer explicit host/port/db variables to guarantee JDBC URL format.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Render injects PORT dynamically in many setups.
server.port=${PORT:${SERVER_PORT:10000}}
server.address=0.0.0.0

# Production-safe defaults
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

# Avoid immediate hard-fail during brief DB readiness windows on deploy.
spring.datasource.hikari.initialization-fail-timeout=60000
