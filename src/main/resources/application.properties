spring.application.name=genealogy

# ===============================
# COMMON SETTINGS
# ===============================
# Use env-friendly defaults; profile-specific files can override as needed.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SECURITY (JWT)
# ===============================
app.jwt.secret=${APP_JWT_SECRET:change-this-in-production}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
