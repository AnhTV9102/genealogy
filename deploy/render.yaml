services:
  - type: web
    name: genealogy-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: deploy
      # Render Postgres có thể truyền URL dạng "postgres://..." (không phải JDBC URL).
      # Ứng dụng sẽ tự chuẩn hóa thành "jdbc:postgresql://..." nếu thiếu prefix `jdbc:`.
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: genealogy-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: genealogy-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: genealogy-postgres
          property: password
      # Build JDBC URL from discrete DB fields to avoid non-jdbc URL formats.
      - key: DB_HOST
        fromDatabase:
          name: genealogy-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: genealogy-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: genealogy-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: genealogy-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: genealogy-postgres
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION
        value: "86400000"

databases:
  - name: genealogy-postgres
    plan: free
    databaseName: genealogy
    user: genealogy
    postgresMajorVersion: "16"
